<g font-family="system-ui,-apple-system,Segoe UI,sans-serif" text-anchor="middle">
<text x="300" y="290" font-size="15" font-weight="700" fill="#0b0b0b">inner ring: minor</text>
<text x="300" y="312" font-size="15" font-weight="700" fill="#0b0b0b">outer ring: major</text>
<text x="300" y="334" font-size="12" fill="#52514e">one step = one fifth</text>
<text x="300" y="604" font-size="22" font-weight="700" fill="#0b0b0b">Twelve keys, one circle</text>
<text x="300" y="630" font-size="14" fill="#52514e">Neighbouring keys share six of their seven notes,</text>
<text x="300" y="650" font-size="14" fill="#52514e">so a playlist that walks the wheel step by step never clashes.</text>
<text x="300" y="670" font-size="12" fill="#a8401a" font-weight="600">8B → 8A → 9A → 10A → 10B → 11B → 11A → 1A → 12A</text>
</g></svg>
