<title id="t">A walk around the Camelot wheel</title>
<desc id="d">The 24 musical keys arranged as the Camelot wheel: major keys on the outer ring, minor keys on the inner ring, numbered 1 to 12 like a clock. An orange line traces a playlist moving between neighbouring keys, the way a smooth DJ set does.</desc>
